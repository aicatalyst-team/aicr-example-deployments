apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "nvidia-dra-driver-gpu-ocp"
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  project: "default"
  sources:
    - repoURL: oci://registry.k8s.io/dra-driver-nvidia/charts/dra-driver-nvidia-gpu
      chart: dra-driver-nvidia-gpu
      targetRevision: 0.4.1
      helm:
        valueFiles:
          - $values/012-nvidia-dra-driver-gpu-ocp/values.yaml
    - repoURL: 'git@github.com:aicatalyst-team/aicr-example-deployments.git'
      targetRevision: main
      ref: values
      path: ocp/inference-nim/bundles
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "nvidia-dra-driver"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply: enabled uniformly across all generated
      # Applications. Required for charts whose CRDs exceed kubectl's
      # 262144-byte client-side annotation cap (e.g.,
      # kube-prometheus-stack, kai-scheduler) — otherwise Argo's sync
      # retries forever with "metadata.annotations: Too long". The
      # apiserver's structured-merge path has no such cap. Benign on
      # Applications that don't need it (pre-folder Namespaces,
      # post-folder ConfigMaps) — keeping it on every Application avoids
      # per-Application template branching and a confusing mix of sync
      # strategies in a single bundle.
      - ServerSideApply=true
