apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "nvidia-stack"
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: git@github.com:aicatalyst-team/aicr-example-deployments.git
    targetRevision: main
    path: ocp/inference-nim/bundles
    directory:
      recurse: true
      include: '*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
